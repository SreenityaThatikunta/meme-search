name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Only the dev requirements: services/search.py defers torch, faiss, clip
      # and pymongo to call time, so the suite runs without a model or database.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Validate extension manifest
        run: python -c "import json; json.load(open('meme-extension/manifest.json'))"
